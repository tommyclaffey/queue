<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sign in · Queue</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  .signin { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .signin .card { width: min(380px, 100%); display: flex; flex-direction: column; gap: 16px; padding: 28px; }
  .signin .logo { padding: 0; }
</style>
<script>(function () { var t = localStorage.getItem('queue-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; })();</script>
</head>
<body>
<main class="signin">
  <form class="card" id="f">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg></span><span class="logo-word">Queue</span></div>
    <div><h1 class="h2">Sign in</h1><div class="small muted">This Queue is online. Enter its password.</div></div>
    <label class="field"><span>Password</span><input class="input" id="pw" type="password" autocomplete="current-password" required autofocus /></label>
    <div class="small" id="err" style="color:var(--danger)" role="alert"></div>
    <button class="btn primary block" id="go" type="submit">Sign in</button>
  </form>
</main>
<script>
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Queue': '1' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      if (r.ok) return location.reload();
      err.textContent = (await r.json().catch(() => ({}))).error || 'Something went wrong.';
    } catch { err.textContent = "Couldn't reach Queue."; }
    go.disabled = false;
  });
</script>
</body>
</html>

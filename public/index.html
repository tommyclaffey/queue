<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Queue — Social Media Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="/styles.css" />
<script>
  // Apply the saved theme before first paint (no flash).
  (function () { var t = localStorage.getItem('queue-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; })();
</script>
</head>
<body>
<a class="skip" href="#content" onclick="event.preventDefault();document.getElementById('content').focus()">Skip to content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Queue navigation">
    <div class="brand-row">
      <a class="logo" href="#/dashboard" aria-label="Queue home">
        <span class="logo-mark"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg></span>
        <span class="logo-word">Queue</span>
        <span class="demo-tag hidden" id="demoTag" title="Sample account and content. Nothing here ever posts.">Demo</span>
      </a>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
    </div>
    <div class="account" id="account"></div>
    <a class="btn primary block" href="#/new" id="newPostBtn"><span class="ico" data-icon="plus"></span>New post</a>
    <div class="nav-label">Workspace</div>
    <nav class="nav" id="nav" aria-label="Workspace"></nav>
    <div class="spacer"></div>
    <div class="demo-note hidden" id="demoNote"></div>
    <div class="heartbeat" id="heartbeat"></div>
    <div class="me hidden" id="me"></div>
  </aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="content" id="content" tabindex="-1"></section>
  </main>
</div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
<script src="/pages.js"></script>
</body>
</html>
